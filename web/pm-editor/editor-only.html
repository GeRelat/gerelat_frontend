<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeRelat Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: #070B14;
        color: #e2e8f0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Toolbar ──────────────────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        background: #10172A;
        border-bottom: 1px solid #22304D;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .toolbar-sep { width: 1px; height: 20px; background: #22304D; margin: 0 4px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 4px 8px; border-radius: 6px; border: 1px solid transparent;
        font-size: 13px; font-family: inherit; cursor: pointer;
        background: transparent; color: #94a3b8; transition: background .15s, color .15s;
        min-width: 28px; height: 28px;
      }
      .btn:hover { background: #1a2540; color: #e2e8f0; }
      .btn.active { background: #1e3a5f; color: #6FE7C8; border-color: #2a4a6b; }

      /* ── Editor scroll area ───────────────────────────────────── */
      .editor-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px;
        background: #070B14;
      }
      .editor-paper {
        max-width: 760px;
        margin: 0 auto;
        background: #0D1426;
        border: 1px solid #22304D;
        border-radius: 12px;
        padding: 40px 48px;
        min-height: 600px;
      }

      /* ── ProseMirror ──────────────────────────────────────────── */
      .ProseMirror {
        outline: none;
        min-height: 500px;
        line-height: 1.7;
        color: #e2e8f0;
        font-size: 15px;
      }
      .ProseMirror p { margin: 0 0 10px; }
      .ProseMirror h1 { font-size: 22px; font-weight: 700; margin: 0 0 14px; color: #f1f5f9; }
      .ProseMirror h2 { font-size: 17px; font-weight: 700; margin: 14px 0 10px; color: #f1f5f9; }
      .ProseMirror h3 { font-size: 15px; font-weight: 600; margin: 12px 0 8px; color: #f1f5f9; }
      .ProseMirror ul, .ProseMirror ol { padding-left: 24px; margin: 0 0 10px; }
      .ProseMirror li { margin: 4px 0; }
      .ProseMirror blockquote {
        border-left: 3px solid #334155; padding-left: 14px; color: #94a3b8; margin: 10px 0;
      }
      .ProseMirror code { font-family: 'JetBrains Mono', monospace; font-size: 13px;
        background: #1a2540; padding: 1px 5px; border-radius: 4px; }

      /* ── Custom nodes ─────────────────────────────────────────── */
      .node-chip {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 1px 8px; border-radius: 12px; font-size: 12px;
        font-family: 'JetBrains Mono', monospace;
        border: 1px solid; user-select: none; cursor: default;
        vertical-align: middle; margin: 0 2px;
      }
      .node-chip-text { background: #1a2540; border-color: #2563eb; color: #93c5fd; }
      .node-block {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 12px; border-radius: 8px; border-left: 3px solid;
        margin: 6px 0; font-size: 13px; font-family: 'JetBrains Mono', monospace;
        user-select: none; cursor: default;
      }
      .node-block-richtext { background: #0d2a2a; border-color: #14b8a6; color: #5eead4; }
      .node-block-image    { background: #0d1e2a; border-color: #3b82f6; color: #93c5fd; }
      .node-block-table    { background: #0d2a14; border-color: #22c55e; color: #86efac; }
      .node-custom-text {
        border: 1px solid #2563eb; border-left: 3px solid #6FE7C8;
        border-radius: 8px; padding: 10px 14px; margin: 8px 0;
        background: #0d1a30;
      }
      .node-custom-text .custom-label {
        font-size: 11px; color: #6FE7C8; font-family: 'JetBrains Mono', monospace;
        margin-bottom: 4px; opacity: .7;
      }
      .node-block-resolved {
        background: #0d1a30; border: 1px solid #22304D; border-radius: 8px;
        padding: 10px 14px; margin: 8px 0; color: #94a3b8; font-size: 13px;
      }
      .dt-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      .dt-table th, .dt-table td {
        padding: 6px 10px; border: 1px solid #22304D; font-size: 12px; text-align: left;
      }
      .dt-table th { background: #1a2540; font-weight: 600; }
      .dt-caption { font-size: 11px; color: #64748b; font-style: italic; margin-bottom: 4px; }
    </style>
    <script type="module" crossorigin src="./assets/editor-BhrJDVXu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/commands-DW3W4uyt.js">
    <link rel="stylesheet" crossorigin href="./assets/commands-bbIDDB3r.css">
  </head>
  <body>
    <div class="toolbar" id="toolbar">
      <button class="btn" id="btn-bold"      title="Negrito (Ctrl+B)"><b>B</b></button>
      <button class="btn" id="btn-italic"    title="Itálico (Ctrl+I)"><i>I</i></button>
      <button class="btn" id="btn-underline" title="Sublinhado (Ctrl+U)"><u>U</u></button>
      <div class="toolbar-sep"></div>
      <button class="btn" id="btn-h1"   title="Título 1">H1</button>
      <button class="btn" id="btn-h2"   title="Título 2">H2</button>
      <button class="btn" id="btn-h3"   title="Título 3">H3</button>
      <button class="btn" id="btn-para" title="Parágrafo">¶</button>
      <div class="toolbar-sep"></div>
      <button class="btn" id="btn-undo" title="Desfazer (Ctrl+Z)">↩︎</button>
      <button class="btn" id="btn-redo" title="Refazer (Ctrl+Y)">↪︎</button>
    </div>
    <div class="editor-scroll">
      <div class="editor-paper">
        <div id="editor-mount"></div>
      </div>
    </div>
  </body>
</html>
